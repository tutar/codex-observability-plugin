name: Release

on:
  push:
    tags: ["*.*.*"]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing immutable release tag to verify and publish
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish immutable release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and release contract
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_REF: ${{ inputs.release_ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            release_ref="$REQUESTED_REF"
          else
            release_ref="$GITHUB_REF_NAME"
          fi
          release_commit="$(git rev-list -n 1 "$release_ref")"
          manifest_version="$(node -p 'require("./plugins/tracing/.codex-plugin/plugin.json").version')"
          test "$release_ref" = "$manifest_version"
          if [[ "$EVENT_NAME" != "workflow_dispatch" ]]; then
            test "$release_commit" = "$GITHUB_SHA"
          fi
          if gh release view "$release_ref" >/dev/null 2>&1; then
            echo "Release $release_ref already exists; refusing to replace it." >&2
            exit 1
          fi
          echo "RELEASE_REF=$release_ref" >> "$GITHUB_ENV"
          echo "RELEASE_COMMIT=$release_commit" >> "$GITHUB_ENV"
          pnpm run lint
          pnpm test
          node --check plugins/tracing/dist/index.mjs

      - name: Install compatible Codex CLI
        run: |
          codex_version="$(node -p 'require("./release/metadata.json").codexCompatibility')"
          npm install --global "@openai/codex@$codex_version"

      - name: Verify standard Marketplace installation by tag
        run: pnpm run verify:install -- "$RELEASE_REF"

      - name: Verify standard Marketplace installation by commit
        run: pnpm run verify:install -- "$RELEASE_COMMIT"

      - name: Build release notes
        run: GITHUB_SHA="$RELEASE_COMMIT" node scripts/release-notes.mjs > release-notes.md

      - name: Publish GitHub Release without moving the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$RELEASE_REF" --verify-tag --notes-file release-notes.md
