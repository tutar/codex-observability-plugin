name: Release

on:
  push:
    tags: ["*.*.*"]

permissions:
  contents: write

jobs:
  release:
    name: Verify and publish immutable release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify tag and release contract
        env:
          TAG_NAME: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          manifest_version="$(node -p 'require("./plugins/tracing/.codex-plugin/plugin.json").version')"
          test "$TAG_NAME" = "$manifest_version"
          test "$(git rev-list -n 1 "$TAG_NAME")" = "$GITHUB_SHA"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; refusing to replace it." >&2
            exit 1
          fi
          pnpm run lint
          pnpm test
          node --check plugins/tracing/dist/index.mjs

      - name: Install compatible Codex CLI
        run: |
          codex_version="$(node -p 'require("./release/metadata.json").codexCompatibility')"
          npm install --global "@openai/codex@$codex_version"

      - name: Verify standard Marketplace installation by tag
        run: pnpm run verify:install -- "$GITHUB_REF_NAME"

      - name: Verify standard Marketplace installation by commit
        run: pnpm run verify:install -- "$GITHUB_SHA"

      - name: Build release notes
        run: node scripts/release-notes.mjs > release-notes.md

      - name: Publish GitHub Release without moving the tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --notes-file release-notes.md
